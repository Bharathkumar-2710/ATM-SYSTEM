<!DOCTYPE html>
<html>
<head>
    <title>Delete Account</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            text-align: center;
        }

        .atm-box {
            width: 400px;
            margin: 100px auto;
            padding: 25px;
            background: #2c2c2c;
            border-radius: 15px;
            box-shadow: 0 0 20px black;
        }

        h2 {
            color: #ff4d4d;
        }

        p {
            color: #cccccc;
            font-size: 14px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }

        button {
            padding: 10px 15px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn {
            background: red;
            color: white;
        }

        .cancel-btn {
            background: #0099ff;
            color: white;
        }

        .error {
            color: #ff4d4d;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="atm-box">

    <h2>Delete Account</h2>

    <p>Account Holder: <b>{{ name }}</b></p>
    <p>Enter your PIN to confirm deletion</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <input type="password" name="pin" placeholder="Enter PIN" required><br>

        <button type="submit" class="delete-btn">Delete Account</button>
    </form>

    <a href="/dashboard">
        <button class="cancel-btn">Cancel</button>
    </a>

</div>

</body>
</html>
