<!DOCTYPE html>
<html>
<head>
    <title>Account Deleted</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            text-align: center;
        }

        .atm-box {
            width: 400px;
            margin: 120px auto;
            padding: 25px;
            background: #2c2c2c;
            border-radius: 15px;
            box-shadow: 0 0 20px black;
        }

        h2 {
            color: #00ffcc;
        }

        p {
            color: #cccccc;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #0099ff;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="atm-box">

    <h2>Account Deleted Successfully</h2>

    <p>Your account has been removed from the system.</p>
    <p>Thank you for using our ATM service.</p>

    <a href="/">
        <button>Return to Home</button>
    </a>

</div>

</body>
</html>
